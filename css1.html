<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    div p{ /*decedent - Selects all <p> elements inside a <div>, even if deeply nested.*/
      color:blue
    }
    div > p{ /*Child Selector- Selects only <p> elements that are direct children of <div>.*/
      font-weight:bold;
    }
    /* h2+p adjacent Sibling selector - Selects the first <p> immediately after an <h2>.
    {
      color:green
    } */
    h2 ~ p{ /* General Sibling seletctor - Selects all <p> elements that come after an <h2> and share the same parent.*/
      color:purple
    }
  </style>
</head>
<body>
  <div>
    <p>This paragrapgh is inside div</p>
    <section>
      <p>This is also selectd</p>
    </section>
    <h2>Heading</h2>
  </div>
  <h2>Heading 1</h2>
  <p>Heading 2</p>
  <p>This paragrapgh is outside div</p>
</body>
</html>
