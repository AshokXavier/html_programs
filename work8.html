<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body{
      margin:0 50px;
      background-color: burlywood;
    }
    .nav{
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: black;
      color: white;
    }

    .left
    {
      display: flex;
      gap:80px;
      padding-left:30px;
    }
    .right{
      margin-right: 30px;
    }

    .right button{
      background-color: white;
      border:2px solid white;
      font-size: 15px;
      border-radius: 2px;
      padding:5px 15px;
    }

    .grid-container{
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      grid-template-rows: 250px 250px 250px;
    }

    .box1 {
    grid-column: 1 / 3;
    grid-row: 1 / 3;
}
  .box2{
    grid-column: 3;
    grid-row: 1;
  }

  .box3{
    grid-column:3;
    grid-row:2/4;

  }
  .box4{
    grid-column: 1;
    grid-row:3;
  }
.box5 {
    grid-column: 2;
    grid-row: 3;
}
 
  .box img{
    width:100%;
    height: 100%;
    object-fit: cover;
  }
  </style>
</head>
<body>
  <div class="nav">
    <div class="left">
      <h2>SONY</h2>
      <h5>Electronics</h5>
      <h5>Playstation</h5>
      <h5>Entertainment</h5>
      <h5>Support</h5>
    </div>
    <div class="right">
      <button value="submit">Search</button>
    </div>
  </div>

  <div class="grid-container">

    <div class="box box1"><img src="work8_img7.jfif"></div>
    <div class="box box2"><img src="work8_img2.jpg"></div>
    <div class="box box3"><img src="work8_img6.jfif"></div>
    <div class="box box4"><img src="work8_img4.webp"></div>
    <div class="box box5"><img src="work8_img5.webp"></div>


  </div>
</body>
</html>
